name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
          pip install pytest "ruff>=0.5,<0.16"

      - name: Lint
        run: ruff check solutions tests experiments perf scripts

      - name: Docs consistency
        run: python scripts/check_docs.py

      - name: Reference implementation (fast)
        env:
          TINYENGRAM_IMPL: solutions
        run: pytest -q -m "not slow and not gpu"

      - name: Reference implementation (slow)
        env:
          TINYENGRAM_IMPL: solutions
        run: pytest -q -m slow

      - name: Paper arithmetic
        env:
          TINYENGRAM_IMPL: solutions
        run: python scripts/paper_math.py

      - name: Grade reference
        env:
          TINYENGRAM_IMPL: solutions
        run: python scripts/grade.py --solution
