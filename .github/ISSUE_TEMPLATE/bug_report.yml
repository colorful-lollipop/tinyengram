name: Bug report
description: Report a reproducible bug in code, tests, docs, or experiments.
title: "[Bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        For security vulnerabilities, do **not** open a public issue — see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
      placeholder: "`pytest tests/test_l1_hashing.py` fails because ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Exact commands, code, or notebook cells. Include the smallest example.
      render: bash
      placeholder: |
        git clone https://github.com/colorful-lollipop/tinyengram
        cd tinyengram
        TINYENGRAM_IMPL=solutions pytest tests/test_l1_hashing.py -x -q
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output / traceback
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "main @ 1bbd8f7"
    validations:
      required: true
  - type: dropdown
    id: implementation
    attributes:
      label: Implementation
      options:
        - solutions (reference)
        - src (my implementation)
        - both
        - not applicable (docs/experiments)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PyTorch, OS, CPU/GPU (and CUDA version if relevant).
      placeholder: "Python 3.12, PyTorch 2.6, Ubuntu 24.04, RTX 4070 Ti Super"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and the FAQ.
          required: true
        - label: I have run the minimal reproduction on the latest `main`.
          required: true
