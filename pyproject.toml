[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyengram"
version = "0.1.0"
description = "A test-driven course that implements DeepSeek Engram conditional memory from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TinyEngram contributors" }]
keywords = [
    "llm",
    "engram",
    "conditional-memory",
    "n-gram",
    "sparsity",
    "mixture-of-experts",
    "pytorch",
    "triton",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
perf = ["triton>=3.0"]
plot = ["matplotlib>=3.8"]
hf = ["transformers>=4.40", "tokenizers>=0.19", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/colorful-lollipop/tinyengram"
Repository = "https://github.com/colorful-lollipop/tinyengram"
Issues = "https://github.com/colorful-lollipop/tinyengram/issues"
Changelog = "https://github.com/colorful-lollipop/tinyengram/blob/main/CHANGELOG.md"
Documentation = "https://github.com/colorful-lollipop/tinyengram/blob/main/docs/README.md"
Paper = "https://github.com/deepseek-ai/Engram"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tinyengram*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: 端到端训练 / 复现实验，默认跳过（make test-all 或 pytest -m ''）",
    "gpu: 需要 CUDA 的测试，CPU 环境自动 skip",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# 骨架刻意保留学员实现时需要的 import（例如 unicodedata / F / ShortConv）。
"src/tinyengram/*.py" = ["F401"]
